# Cloudflare account (Wrangler / R2). Do not put API secrets or account_id in this file.
# Use `wrangler login`, or set CLOUDFLARE_ACCOUNT_ID in the environment (see config/r2.example.env).
name = "dongli-blog-r2"
compatibility_date = "2024-01-01"

# R2 bucket for blog images (see docs/r2-image-hosting.md)
[[r2_buckets]]
binding = "BLOG_IMAGES"
bucket_name = "dongli-blog-resources"
