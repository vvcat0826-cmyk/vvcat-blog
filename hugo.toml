# Local dev: keep localhost. Production URL is set in Cloudflare Pages build
# (e.g. hugo --minify --baseURL "$CF_PAGES_URL/") or in .github/workflows/cloudflare-pages.yml.
baseURL = 'http://localhost:1313/'
defaultContentLanguage = 'zh-cn'
defaultContentLanguageInSubdir = false

[module]
  [[module.imports]]
    path = "github.com/JoeYang1412/hugo-theme-spectra"

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  series = 'series'

[params]
  # R2 image CDN base (no trailing slash). Replace example.com after binding img subdomain.
  imageCDN = "https://img.example.com"
  homepagePostsLimit = 10
  cardSummaryLength = 150
  relatedPostsLimit = 3
  cardImageQuality = 80
  coverImageQuality = 85

  enableLoadingAnimation = true
  enableMouseGlow = true
  showBanner = true
  showReadingProgress = true
  enableLightbox = true
  showScrollTop = true
  enableSearch = true
  showRelatedPosts = true
  showSeriesNav = true
  enableCodeCopy = true
  enableScrollAnimation = true

  sharePlatforms = ['twitter', 'facebook', 'linkedin']

  googleFontsURL = 'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap'

  [params.style]
    colorAccent = '#4a7de0'
    colorAccentWarm = '#e8609e'
    colorAccentSoft = '#a78bfa'
    fontDisplay = "'Outfit', sans-serif"
    fontBody = "'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
    fontMono = "'JetBrains Mono', monospace"
    bannerImageText = '#fff'
    bannerImageGradient = 'linear-gradient(135deg, #4a7de0, #e8609e)'
    bannerImageGradientFill = 'transparent'

  [params.sidebar]
    showAllPosts = true
    showCategories = true
    showTags = true
    showRecent = true
    categoryLimit = 5
    tagsLimit = 20
    recentLimit = 5

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false
    lineNos = false
    lineNumbersInTable = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]

[languages]
  [languages.zh-cn]
    locale = 'zh-cn'
    label = '简体中文'
    weight = 1
    title = '东篱'

    [languages.zh-cn.params]
      description = '一款具有科幻风格的 Hugo 博客主题'
      author = '东篱'
      bio = '采菊东篱下，悠然见南山'

    [[languages.zh-cn.params.social]]
      name = "GitHub"
      url = "https://github.com/"
    [[languages.zh-cn.params.social]]
      name = "Email"
      url = "mailto:you@example.com"
    [[languages.zh-cn.params.social]]
      name = "RSS"
      url = "/index.xml"

    [[languages.zh-cn.menus.main]]
      name = "首页"
      pageRef = "/"
      weight = 1
      pre = "⌂"
    [[languages.zh-cn.menus.main]]
      name = "文章"
      pageRef = "/posts"
      weight = 2
      pre = "✎"
    [[languages.zh-cn.menus.main]]
      name = "关于"
      pageRef = "/about"
      weight = 5
      pre = "◉"

  [languages.en]
    locale = 'en'
    label = 'English'
    weight = 2
    title = '东篱'

    [languages.en.params]
      description = 'A sci-fi fusion Hugo blog theme'
      author = '东篱'
      bio = '采菊东篱下，悠然见南山'

    [[languages.en.params.social]]
      name = "GitHub"
      url = "https://github.com/"
    [[languages.en.params.social]]
      name = "Email"
      url = "mailto:you@example.com"
    [[languages.en.params.social]]
      name = "RSS"
      url = "/index.xml"

    [[languages.en.menus.main]]
      name = "Home"
      pageRef = "/"
      weight = 1
      pre = "⌂"
    [[languages.en.menus.main]]
      name = "Blog"
      pageRef = "/posts"
      weight = 2
      pre = "✎"
    [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 5
      pre = "◉"

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
