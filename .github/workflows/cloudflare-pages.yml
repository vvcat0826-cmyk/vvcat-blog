# Optional: use this if you prefer GitHub Actions → Cloudflare Pages (Wrangler)
# instead of Cloudflare Dashboard “Connect to Git”.
# Required repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Create API token: Cloudflare Dashboard → My Profile → API Tokens →
#   “Edit Cloudflare Workers” template or custom with Account / Cloudflare Pages Edit.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      HUGO_VERSION: "0.167.0"
      GO_VERSION: "1.22.0"
      # Must match your Cloudflare Pages project name → https://<name>.pages.dev/
      CF_PAGES_PROJECT: dongli-blog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: |
          hugo mod get
          hugo --minify --baseURL "https://${CF_PAGES_PROJECT}.pages.dev/"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CF_PAGES_PROJECT }}
